services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: examos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: examos
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["examdb:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examos"]
      interval: 5s
      retries: 10
volumes:
  examdb:
